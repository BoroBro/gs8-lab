plugins { id 'com.android.application' }

android {
    namespace 'com.gs8.lab'
    compileSdk 34

    defaultConfig {
        applicationId "com.gs8.lab"
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName "0.1"
    }

    signingConfigs {
        release {
            storeFile file('gs8lab.keystore')
            storePassword 'gs8store'
            keyAlias 'gs8'
            keyPassword 'gs8store'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint { checkReleaseBuilds false; abortOnError false }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
